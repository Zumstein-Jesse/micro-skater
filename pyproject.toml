[build-system]
requires = ["setuptools>=77"]  # PEP 639: the SPDX license string and license-files
build-backend = "setuptools.build_meta"

[project]
name = "micro-skater"
version = "0.1.0"
description = "Running and skateboarding tasks for the Microduck robot: an add-on to microduck_rl (mjlab + rsl_rl)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12, <3.13"
dependencies = [
    # microduck_rl is not on PyPI: install it first from git (see README, "Install"). Tested with commit
    # bae39f5900b318f7e87fc485c30a31213cfa14eb, which pins mjlab 1.3.0, rsl_rl 5.0.1, torch 2.9.1, warp 1.12.0.
    "mjlab-microduck",
    "mjlab==1.3.0",
    "numpy",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/zumstein-jesse/micro-skater"

[project.entry-points."mjlab.tasks"]
micro_skater = "micro_skater.tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micro_skater = ["data/*.json", "data/*.npz", "robot/assets/*.xml"]
